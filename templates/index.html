<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartVia — Tráfico en vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 px-5 py-2.5">
      <h1 class="text-lg font-semibold tracking-tight">SmartVia</h1>
      <p class="text-xs text-slate-400">Análisis de tráfico en tiempo real · {{ video_name }}</p>
    </header>

    <main class="flex flex-wrap items-start gap-4 p-4">
      <section class="w-fit max-w-full overflow-hidden rounded-xl border border-slate-800 bg-slate-900">
        <div class="border-b border-slate-800 px-3 py-2 text-xs font-medium text-slate-300">
          Stream procesado (bbox, ID, MOVING / STATIONARY)
        </div>
        <div class="bg-black p-2">
          <img
            src="/video"
            alt="Video procesado SmartVia"
            class="block max-h-[58vh] w-auto max-w-full object-contain"
          />
        </div>
      </section>

      <aside class="w-full max-w-xs space-y-4">
        <div id="status-card" class="rounded-xl border border-emerald-700/60 bg-emerald-950/40 p-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">Estado del tráfico</p>
          <p id="status-label" class="mt-2 text-2xl font-semibold text-emerald-400">Tráfico Fluido</p>
        </div>

        <div class="rounded-xl border border-slate-800 bg-slate-900 p-4 space-y-3">
          <div class="flex justify-between text-sm">
            <span class="text-slate-400">Vehículos</span>
            <span id="vehicle-count" class="font-mono">0</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-400">Estacionarios</span>
            <span id="stationary-count" class="font-mono">0</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-400">Última alerta FCM</span>
            <span id="last-alert" class="font-mono text-xs">—</span>
          </div>
        </div>

        <p id="error-box" class="hidden rounded-xl border border-amber-700/50 bg-amber-950/40 p-4 text-sm text-amber-200"></p>
      </aside>
    </main>

    <script>
      const card = document.getElementById("status-card");
      const label = document.getElementById("status-label");
      const vehicles = document.getElementById("vehicle-count");
      const stationary = document.getElementById("stationary-count");
      const lastAlert = document.getElementById("last-alert");
      const errorBox = document.getElementById("error-box");

      async function refreshStatus() {
        try {
          const res = await fetch("/api/status");
          const data = await res.json();
          vehicles.textContent = data.vehicle_count;
          stationary.textContent = data.stationary_count;
          lastAlert.textContent = data.last_alert_at || "—";
          if (data.jam) {
            label.textContent = "Embotellamiento Detectado";
            label.className = "mt-2 text-2xl font-semibold text-red-400";
            card.className = "rounded-xl border border-red-700/60 bg-red-950/40 p-4";
          } else {
            label.textContent = "Tráfico Fluido";
            label.className = "mt-2 text-2xl font-semibold text-emerald-400";
            card.className = "rounded-xl border border-emerald-700/60 bg-emerald-950/40 p-4";
          }
          if (data.error) {
            errorBox.textContent = data.error;
            errorBox.classList.remove("hidden");
          } else {
            errorBox.classList.add("hidden");
          }
        } catch (err) {
          errorBox.textContent = "Sin conexión con /api/status";
          errorBox.classList.remove("hidden");
        }
      }

      refreshStatus();
      setInterval(refreshStatus, 1000);
    </script>
  </body>
</html>
